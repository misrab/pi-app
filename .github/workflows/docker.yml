name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # lightsail-1 is x86_64; add linux/arm64 if you add ARM servers.
          platforms: linux/amd64
          tags: |
            ghcr.io/misrab/pi-app:latest
            ghcr.io/misrab/pi-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
