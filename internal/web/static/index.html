<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>pi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0f1117; --panel:#1e2130; --muted:#64748b; --text:#e2e8f0; --accent:#7c9cff; --tool:#a78bfa; --think:#475569; }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #262a3a; display: flex; align-items: center; gap: 8px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  header .dot.on { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  header h1 { font-size: 1rem; font-weight: 600; }
  header .status { font-size: 0.75rem; color: var(--muted); margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { padding: 12px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; font-size: 0.92rem; }
  .user { background: #243049; align-self: flex-end; max-width: 85%; }
  .assistant { background: var(--panel); align-self: flex-start; max-width: 95%; }
  .thinking { background: transparent; border: 1px dashed #2c3142; color: var(--think); font-size: 0.82rem; align-self: flex-start; max-width: 95%; font-style: italic; }
  .tool { background: #1a1530; border: 1px solid #2e2452; align-self: flex-start; max-width: 95%; font-size: 0.82rem; font-family: ui-monospace, monospace; }
  .tool .tname { color: var(--tool); font-weight: 600; }
  .tool pre { white-space: pre-wrap; word-break: break-word; margin-top: 6px; color: #b9c2d0; max-height: 240px; overflow-y: auto; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #262a3a; max-width: 820px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid #2c3142; border-radius: 8px; padding: 10px 12px; font-size: 1rem; font-family: inherit; min-height: 44px; max-height: 160px; }
  button { background: var(--accent); color: #0f1117; border: none; border-radius: 8px; padding: 0 18px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <span class="dot" id="conn-dot"></span>
  <h1>pi</h1>
  <span class="status" id="status">connecting…</span>
</header>

<div id="log"></div>

<form id="form">
  <textarea id="input" placeholder="Message pi…" rows="1" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const form = document.getElementById('form');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');
const connDot = document.getElementById('conn-dot');

let ws;
let streaming = false;
let curAssistant = null;   // current assistant text bubble
let curThinking = null;    // current thinking bubble
const tools = {};          // toolCallId -> element

function scrollDown() { log.scrollTop = log.scrollHeight; }

function bubble(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (text !== undefined) el.textContent = text;
  log.appendChild(el);
  scrollDown();
  return el;
}

function setStatus(s, busy) {
  status.textContent = s;
  sendBtn.disabled = busy;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');

  ws.onopen = () => { connDot.classList.add('on'); setStatus('ready', false); };
  ws.onclose = () => { connDot.classList.remove('on'); setStatus('disconnected', true); setTimeout(connect, 1500); };
  ws.onerror = () => setStatus('error', false);
  ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
}

function send(cmd) { ws.send(JSON.stringify(cmd)); }

function handleEvent(ev) {
  switch (ev.type) {
    case 'agent_start':
      streaming = true;
      curAssistant = null;
      curThinking = null;
      setStatus('thinking…', true);
      break;

    case 'message_update': {
      const d = ev.assistantMessageEvent;
      if (!d) break;
      if (d.type === 'text_delta') {
        if (!curAssistant) curAssistant = bubble('assistant', '');
        curAssistant.textContent += d.delta;
        scrollDown();
      } else if (d.type === 'thinking_delta') {
        if (!curThinking) curThinking = bubble('thinking', '');
        curThinking.textContent += d.delta;
        scrollDown();
      } else if (d.type === 'text_start') {
        curAssistant = null;
      } else if (d.type === 'thinking_start') {
        curThinking = null;
      }
      break;
    }

    case 'tool_execution_start': {
      const el = document.createElement('div');
      el.className = 'msg tool';
      el.innerHTML = '<span class="tname">' + ev.toolName + '</span>' +
        '<pre>' + escapeHtml(JSON.stringify(ev.args || {}, null, 2)) + '</pre>';
      log.appendChild(el);
      tools[ev.toolCallId] = el;
      scrollDown();
      break;
    }

    case 'tool_execution_end': {
      const el = tools[ev.toolCallId];
      if (el) {
        const out = (ev.result && ev.result.content || [])
          .filter(c => c.type === 'text').map(c => c.text).join('\n');
        const pre = document.createElement('pre');
        pre.textContent = out || '(no output)';
        if (ev.isError) pre.style.color = '#f87171';
        el.appendChild(pre);
        scrollDown();
      }
      break;
    }

    case 'agent_end':
      streaming = false;
      curAssistant = null;
      curThinking = null;
      setStatus('ready', false);
      break;
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function submit() {
  const text = input.value.trim();
  if (!text || streaming) return;
  bubble('user', text);
  send({ type: 'prompt', message: text });
  input.value = '';
  input.style.height = 'auto';
}

form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

connect();
</script>
</body>
</html>
